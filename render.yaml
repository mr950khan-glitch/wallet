
services:
  - type: web
    name: xnceeer-wallet
    runtime: node
    plan: free

    buildCommand: npm install
    startCommand: npm start

    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      - key: FIREBASE_DATABASE_URL
        value: https://xnceeer-default-rtdb.firebaseio.com

      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
